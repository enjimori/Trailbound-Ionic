<!-- Trail-card template: binds the trail summary to TrailCardComponent inputs and forwards selection actions to the parent page. -->
<div class="trail-card" (click)="onTap()">
  <div class="trail-image" [style.backgroundImage]="'url(' + trail.image + ')'"></div>
  <div class="trail-shade"></div>

  <div class="trail-body">
    <span class="diff-badge" [ngClass]="trail.difficulty.toLowerCase()">{{ trail.difficulty }}</span>
    <h3>{{ trail.name }}</h3>
    <p class="region">
      <ion-icon name="location-outline"></ion-icon>
      {{ trail.region }}
    </p>

    <div class="trail-footer">
      <div class="trail-meta">
        <span class="meta"><ion-icon name="walk-outline"></ion-icon>{{ trail.distance }}</span>
        <span class="sep"></span>
        <span class="meta"><ion-icon name="trending-up-outline"></ion-icon>{{ trail.elevation }}</span>
        <!-- Hidden while the rating is 0. The 30-trail dataset ships with no
             review scores, and "★ 0" reads as a bad rating rather than an
             absent one. -->
        <ng-container *ngIf="trail.rating > 0">
          <span class="sep"></span>
          <span class="meta"><ion-icon name="star" class="star"></ion-icon>{{ trail.rating }}</span>
        </ng-container>
      </div>

      <button class="details-btn" (click)="onDetails($event)" aria-label="Trail details">
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </button>
    </div>
  </div>
</div>
