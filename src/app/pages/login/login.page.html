<!-- Login template: binds the sign-in form to LoginPage and sends submission to its authentication handler. -->
<ion-content [fullscreen]="true" class="login-content">
  <div class="login-bg" style="background-image: url('assets/trails/T003.jpg')"></div>
  <div class="login-wrap">
    <!-- Brand context appears before the form users submit to LoginPage.signIn(). -->
    <div class="brand">
      <img class="brand-logo" src="assets/logo/walato.png" alt="TrailBound logo" />
      <p>Your trail community awaits</p>
    </div>

    <!-- Reactive form binds validation state to LoginPage and submits through its sign-in handler. -->
    <form class="form-block" [formGroup]="form" (ngSubmit)="signIn()" novalidate>
      <div class="field-group">
        <ion-input
          formControlName="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="Email address"
          class="login-input"
          fill="outline"
        ></ion-input>
        <p class="err" *ngIf="err('email') as msg">{{ msg }}</p>
      </div>

      <div class="field-group">
        <ion-input
          formControlName="password"
          type="password"
          [clearOnEdit]="false"
          autocomplete="current-password"
          placeholder="Password"
          class="login-input"
          fill="outline"
        >
        </ion-input>
        <p class="err" *ngIf="err('password') as msg">{{ msg }}</p>
      </div>

      <label class="remember-row">
        <ion-checkbox formControlName="remember" labelPlacement="end" justify="start">
          Remember me for 7 days
        </ion-checkbox>
      </label>

      <p class="err form-err" *ngIf="loginError">{{ loginError }}</p>

      <button type="submit" class="signin-btn" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign In' }}
      </button>

      <p class="hint">Sign in to continue exploring trails.</p>

      <!-- These links provide account creation or guest browsing when sign-in is not appropriate. -->
      <div class="switch-row">
        <span>New to TrailBound?</span>
        <button type="button" class="link-btn" (click)="goSignUp()">Sign Up</button>
      </div>

      <button type="button" class="guest-btn" (click)="continueAsGuest()">Continue as guest</button>
    </form>
  </div>
</ion-content>
