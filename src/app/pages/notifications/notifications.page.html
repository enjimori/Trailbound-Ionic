<!-- Notifications template: displays notification data and forwards notification actions to NotificationsPage. -->
<ion-header class="ion-no-border">
  <!-- Header actions call NotificationsPage so navigation and read state stay in the controller. -->
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Notifications</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="markAllRead()"
        fill="clear"
        class="mark-btn"
        [disabled]="notificationService.unreadCount() === 0"
      >Mark all read</ion-button>
    </ion-buttons>
  </ion-toolbar>
  <p class="subtitle">Your bookings, permits, documents and people you follow</p>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-pad">
    <!-- Each card is bound to NotificationService; tapping it delegates routing to the page handler. -->
    <button
      type="button"
      class="notif-card"
      *ngFor="let n of notificationService.notifications(); trackBy: trackById"
      [class.unread]="!n.read"
      (click)="onTapNotification(n)"
    >
      <!-- tone -> theme colours (see .notif-icon[data-tone]); iconColor is the
           fallback for anything that sets no tone. -->
      <div
        class="notif-icon"
        [attr.data-tone]="n.tone || null"
        [style.background]="n.tone ? null : n.iconColor + '26'"
      >
        <ion-icon [name]="n.icon" [style.color]="n.tone ? null : n.iconColor"></ion-icon>
      </div>
      <div class="notif-body">
        <div class="notif-title-row">
          <span class="notif-title">{{ n.title }}</span>
          <div class="notif-meta">
            <span class="notif-time">{{ n.time }}</span>
            <span class="unread-dot" *ngIf="!n.read" aria-label="Unread"></span>
          </div>
        </div>
        <p class="notif-message">{{ n.message }}</p>
      </div>
    </button>

    <!-- Empty state is shown only when there are no notification cards to render. -->
    <div class="empty-state" *ngIf="notificationService.notifications().length === 0">
      <ion-icon name="notifications-outline"></ion-icon>
      <p>No notifications yet.</p>
      <p class="empty-sub">Updates on your bookings, permits and documents, and new posts from people you follow, will show up here.</p>
    </div>

    <div class="bottom-spacer"></div>
  </div>
</ion-content>
