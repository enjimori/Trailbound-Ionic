<ion-header class="ion-no-border">
  <ion-toolbar>

    <!-- Brand row — emblem left, notifications right -->
    <div class="brand-row">
      <app-logo badgeOnly [height]="50"></app-logo>

      <button class="bell-btn" (click)="goNotifications()">
        <ion-icon name="notifications-outline"></ion-icon>
        <ion-badge *ngIf="notificationService.unreadCount() > 0" class="bell-badge">{{ notificationService.unreadCount() }}</ion-badge>
      </button>
    </div>

    <div class="header-row">
      <ion-searchbar
        placeholder="Search trails, peaks, or regions..."
        [debounce]="150"
        [value]="searchTerm()"
        (ionInput)="onSearch($event)"
        show-clear-button="focus"
      ></ion-searchbar>

      <button
        class="filter-btn"
        [class.open]="showFilters()"
        (click)="toggleFilters()"
        aria-label="Filter and sort"
      >
        <ion-icon name="options-outline"></ion-icon>
        <span class="filter-dot" *ngIf="activeFilterCount() > 0"></span>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-pad">

    <!-- Filter panel -->
    <div class="filter-panel" *ngIf="showFilters()">
      <div class="filter-group">
        <span class="filter-label">Difficulty</span>
        <div class="filter-options">
          <button
            *ngFor="let d of difficulties"
            class="filter-pill"
            [class.active]="difficulty() === d"
            (click)="setDifficulty(d)"
          >{{ d }}</button>
        </div>
      </div>

      <div class="filter-group">
        <span class="filter-label">Sort by</span>
        <div class="filter-options">
          <button
            *ngFor="let s of sorts"
            class="filter-pill"
            [class.active]="sortBy() === s.key"
            (click)="setSort(s.key)"
          >{{ s.label }}</button>
        </div>
      </div>

      <button
        class="filter-clear"
        *ngIf="activeFilterCount() > 0"
        (click)="clearFilters()"
      >
        <ion-icon name="close"></ion-icon> Clear filters
      </button>
    </div>

    <!-- ── Weather forecast ──────────────────────────────────────────────
         Closed by default. Weather belongs to a specific mountain, so the
         user picks one rather than being shown a figure for "the country".
    -->
    <div class="wx-panel" [class.open]="showWeatherPanel()">
      <button class="wx-head" (click)="toggleWeatherPanel()">
        <ion-icon class="wx-glyph" name="partly-sunny-outline"></ion-icon>
        <span class="wx-head-text">
          <strong>View weather forecast</strong>
          <small>
            {{ weatherTrail()
                ? weatherTrail()!.name
                : 'Pick a mountain to see its conditions' }}
          </small>
        </span>
        <ion-icon
          class="wx-chev"
          [name]="showWeatherPanel() ? 'chevron-up-outline' : 'chevron-down-outline'"
        ></ion-icon>
      </button>

      <div class="wx-body" *ngIf="showWeatherPanel()">

        <!-- Picker: search + list, shown until a mountain is chosen -->
        <ng-container *ngIf="!weatherTrailId()">
          <div class="wx-search">
            <ion-icon name="search-outline"></ion-icon>
            <input
              type="search"
              placeholder="Search a mountain or region..."
              [value]="weatherQuery()"
              (input)="onWeatherSearch($event)"
              aria-label="Search mountains for a forecast"
            />
          </div>

          <div class="wx-list">
            <button
              class="wx-item"
              *ngFor="let t of weatherMatches()"
              (click)="selectWeatherTrail(t.id)"
            >
              <span class="n">{{ t.name }}</span>
              <span class="r">{{ t.region }}</span>
            </button>

            <p class="wx-none" *ngIf="!weatherMatches().length">
              No mountain matches "{{ weatherQuery() }}".
            </p>
          </div>
        </ng-container>

        <!-- Chosen: the real forecast for that summit -->
        <ng-container *ngIf="weatherTrailId() as id">
          <button class="wx-change" (click)="clearWeatherTrail()">
            <ion-icon name="arrow-back-outline"></ion-icon>
            Choose a different mountain
          </button>

          <app-trail-weather [trailId]="id"></app-trail-weather>
        </ng-container>
      </div>
    </div>

    <!-- Category chips -->
    <div class="chip-row scroll-x">
      <ion-chip
        *ngFor="let cat of categories"
        [class.active]="activeCategory() === cat"
        (click)="selectCategory(cat)"
      >
        <ion-label>{{ cat }}</ion-label>
      </ion-chip>
    </div>

    <!-- Trail list -->
    <div class="section-header">
      <span class="section-title">
        {{ isSearching() ? 'Search Results' : 'Top Suggestions' }}
      </span>
      <span class="view-all-link" *ngIf="isSearching(); else viewAllLink">
        {{ resultCount() }} found
      </span>
      <ng-template #viewAllLink>
        <span class="view-all-link" (click)="goExplore()">View all</span>
      </ng-template>
    </div>

    <ng-container *ngIf="filteredTrails().length; else noResults">
      <app-trail-card
        *ngFor="let trail of filteredTrails()"
        [trail]="trail"
        (details)="openTrail($event)"
        (cardTap)="openTrail($event)"
      ></app-trail-card>
    </ng-container>
    <ng-template #noResults>
      <div class="empty-state">
        <ion-icon name="compass-outline"></ion-icon>
        <p *ngIf="isSearching(); else noFilterMatch">
          No trails match "{{ searchTerm() }}"
        </p>
        <ng-template #noFilterMatch>
          <p>No trails match these filters</p>
        </ng-template>
      </div>
    </ng-template>

    <!-- Community posts preview -->
    <div class="section-header">
      <span class="section-title">Community Posts</span>
      <span class="view-all-link" (click)="goCommunity()">TrailTalk Official</span>
    </div>

    <div class="community-preview scroll-x" (click)="goCommunity()">
      <div class="mini-post" *ngFor="let post of latestPosts()">
        <img *ngIf="post.images.length; else avatarOnly" [src]="post.images[0]" />
        <ng-template #avatarOnly>
          <img [src]="post.avatar" />
        </ng-template>
        <div class="mini-post-overlay">
          <span>{{ post.author }}</span>
        </div>
      </div>
    </div>

    <div class="bottom-spacer"></div>
  </div>
</ion-content>
